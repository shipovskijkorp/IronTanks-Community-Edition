
plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.143'
}

version = "${mod_version}+${minecraft_version}+neoforge"
group = mod_group_id

base {
    archivesName = "IronTanks-${minecraft_version}-neoforge"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)


// These classes belonged to the pre-Stonecutter compatibility layer. They were
// deliberately removed when IronTanks switched back to BuildCraft's native
// TileTank/ContainerTank/RenderTank path. Keep them excluded so extracting a
// newer project over an older checkout cannot accidentally compile stale files.
def staleLegacySources = [
        'com/indemnity83/irontanks/client/IronTanksClient.java',
        'com/indemnity83/irontanks/client/IronTanksClientForgeEvents.java',
        'com/indemnity83/irontanks/client/IronTanksClientRuntimeCompat.java',
        'com/indemnity83/irontanks/client/IronTanksClientScreens.java',
        'com/indemnity83/irontanks/client/gui/IronTanksTankComponent.java',
        'com/indemnity83/irontanks/client/gui/IronTanksTankScreen.java',
        'com/indemnity83/irontanks/common/menu/IronTanksTankMenu.java',
        'com/indemnity83/irontanks/common/registry/IronTanksGuis.java',
        'com/indemnity83/irontanks/common/registry/IronTanksMenus.java',
        'com/indemnity83/irontanks/common/util/IronTanksRuntimeCompat.java',
]

sourceSets.main.java {
    staleLegacySources.each { exclude it }
}

// IronTanks does not own the buildcraft.* test namespace. Older overlay
// checkouts may contain BuildCraft's own JUnit/guide tests under src/test;
// never feed those foreign tests into this mod's compileTestJava task.
sourceSets.test.java {
    exclude 'buildcraft/**'
}
sourceSets.test.resources {
    exclude 'buildcraft/**'
}

def versionResourceRoot = rootProject.file("version-resources/${project.name}")
def versionResourceRootPath = versionResourceRoot.toPath().toAbsolutePath().normalize()

sourceSets.main.resources {
    srcDir versionResourceRoot
}

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter { includeGroup 'maven.modrinth' }
    }
    flatDir { dirs rootProject.file("libs/${project.name}") }
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            gameDirectory = project.file('run')
        }
        server {
            server()
            gameDirectory = project.file('run')
            programArgument '--nogui'
        }
        configureEach {
            systemProperty 'forge.logging.markers', ''
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        irontanks {
            sourceSet(sourceSets.main)
        }
    }
}

def bcceDependencyMode = providers.gradleProperty('bcce_dependency_mode')
        .map { it.trim().toLowerCase(java.util.Locale.ROOT) }
        .getOrElse('modrinth')
if (!(bcceDependencyMode in ['local', 'modrinth'])) {
    throw new GradleException("Unsupported bcce_dependency_mode='${bcceDependencyMode}'. Expected 'local' or 'modrinth'.")
}

dependencies {
    if (bcceDependencyMode == 'local') {
        def localBuildCraftJar = rootProject.file(buildcraft_local_jar)
        if (!localBuildCraftJar.isFile()) {
            throw new GradleException(
                    "IronTanks ${project.name}: local BCCE jar not found: ${localBuildCraftJar}. " +
                    "Build BCCE first or switch to -Pbcce_dependency_mode=modrinth.")
        }
        implementation files(localBuildCraftJar)
        logger.lifecycle("IronTanks ${project.name}: using local BCCE jar ${localBuildCraftJar.name}")
    } else {
        def coordinate = "maven.modrinth:${bcce_modrinth_project}:${buildcraft_version}"
        implementation coordinate
        logger.lifecycle("IronTanks ${project.name}: using ${coordinate}")
    }
}

def resourceProperties = [
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_version            : project.version,
        mod_license            : mod_license,
        mod_authors            : mod_authors,
        mod_description        : mod_description,
        loader_version_range   : loader_version_range,
        minecraft_version_range: minecraft_version_range,
        neo_version_range      : neo_version_range,
        buildcraft_version_range: buildcraft_version_range
]

processResources {
    inputs.properties resourceProperties
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    // Keep loader metadata and pack.mcmeta strictly target-local. This also
    // protects overlay upgrades from stale shared Forge/NeoForge templates.
    eachFile { details ->
        if (details.path == 'META-INF/neoforge.mods.toml' || details.path == 'META-INF/mods.toml' || details.path == 'pack.mcmeta') {
            def sourcePath = details.file.toPath().toAbsolutePath().normalize()
            if (!sourcePath.startsWith(versionResourceRootPath)) {
                details.exclude()
            } else if (details.path == 'META-INF/neoforge.mods.toml') {
                details.expand(resourceProperties)
            }
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = java_version as int
}

tasks.named('createMinecraftArtifacts') {
    dependsOn 'stonecutterGenerate'
}

jar {
    from(rootProject.file('LICENSE.txt')) {
        rename { 'LICENSE_IronTanks.txt' }
    }
    from(rootProject.file('NOTICE.md')) {
        rename { 'NOTICE_IronTanks.md' }
    }

    manifest {
        attributes([
                'Specification-Title'      : mod_name,
                'Specification-Vendor'     : mod_authors,
                'Specification-Version'    : '1',
                'Implementation-Title'     : mod_name,
                'Implementation-Version'   : project.version,
                'Implementation-Vendor'    : mod_authors,
                'Implementation-Timestamp' : new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}
